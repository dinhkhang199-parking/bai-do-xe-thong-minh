[tool.pyrefly]
disable-type-errors-in-ide = true

[tool.ruff]
target-version = "py314"
line-length = 100
include = ["backend/**/*.py", "api/**/*.py", "integrations/**/*.py", "scripts/**/*.py", "tests/**/*.py"]
extend-exclude = ["integrations/person1", "work", "-ITS-", "node_modules"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# CLI entry points establish the repository path/environment before app imports.
"scripts/*.py" = ["E402"]

[tool.ruff.format]
line-ending = "lf"
